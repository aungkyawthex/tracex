
name: Deploy TraceX to InfinityFree

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tracex-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npm run build

      - name: Deploy to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: htdocs/
          dangerous-clean-slate: false
          log-level: verbose
          # Keep runtime files only: vendor is a dev-only install (no composer autoload at runtime)
          # and the Font Awesome bundle ships thousands of unused svgs/sprite/metadata files.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/vendor/**
            **/.env*
            **/config/db.php
            **/README.md
            **/.vscode/**
            **/tests/**
            **/storage/logs/**
            **/.ftp-deploy-sync-state.json
            **/phpunit.xml
            **/composer.json
            **/composer.lock
            **/package.json
            **/package-lock.json
            **/fontawesome-free-7.1.0-web/svgs/**
            **/fontawesome-free-7.1.0-web/svgs-full/**
            **/fontawesome-free-7.1.0-web/sprites/**
            **/fontawesome-free-7.1.0-web/sprites-full/**
            **/fontawesome-free-7.1.0-web/metadata/**
            **/fontawesome-free-7.1.0-web/js/**
            **/fontawesome-free-7.1.0-web/scss/**
